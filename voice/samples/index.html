<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick the voices</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; background: #c9f0ff; color: #1d1b3a; margin: 0; padding: 16px; }
  h1 { font-size: 26px; margin: 4px 0 4px; }
  p { margin: 0 0 16px; }
  h2 { font-size: 22px; margin: 22px 0 8px; }
  .card { background: #fff; border: 4px solid #1d1b3a; border-radius: 18px; padding: 12px; margin-bottom: 10px; box-shadow: 0 4px 0 #1d1b3a; }
  .card b { display: block; font-size: 20px; margin-bottom: 6px; }
  audio { width: 100%; }
</style>
</head>
<body>
  <h1>Pick the voices</h1>
  <p>Play each one, then pick a favorite for each buddy.</p>

  <h2>✨ Twinkle (the excited bunny)</h2>
  <div class="card"><b>Twinkle A: "coral"</b><audio controls preload="none" src="twinkle-coral.mp3"></audio></div>
  <div class="card"><b>Twinkle B: "shimmer"</b><audio controls preload="none" src="twinkle-shimmer.mp3"></audio></div>
  <div class="card"><b>Twinkle C: "nova"</b><audio controls preload="none" src="twinkle-nova.mp3"></audio></div>

  <h2>😒 Ruby (the sassy red panda)</h2>
  <div class="card"><b>Ruby A: "sage"</b><audio controls preload="none" src="ruby-sage.mp3"></audio></div>
  <div class="card"><b>Ruby B: "ballad"</b><audio controls preload="none" src="ruby-ballad.mp3"></audio></div>
  <div class="card"><b>Ruby C: "alloy"</b><audio controls preload="none" src="ruby-alloy.mp3"></audio></div>
</body>
</html>
